<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Worker Test</title>
</head>
<body>

<button onclick="test()">تست Worker</button>
<pre id="result"></pre>

<script>
async function test() {
  const result = document.getElementById("result");
  result.textContent = "در حال تست...";

  try {
    const response = await fetch(
      "https://old-fire-5f7e.ydanyali95.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "سلام"
        })
      }
    );

    const text = await response.text();

    result.textContent =
      "Status: " + response.status +
      "\n\n" + text;

  } catch (error) {
    result.textContent =
      "ERROR:\n" + error.message;
  }
}
</script>

</body>
</html>
