<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

h1 {
  text-align: center;
  color: red;
}

#chat {
  height: 75vh;
  overflow-y: auto;
  padding: 15px;
}

.msg {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  white-space: pre-wrap;
}

.user {
  background: #350000;
}

.ai {
  background: #181818;
}

#bottom {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #090909;
  padding: 10px;
  display: flex;
  gap: 8px;
}

#input {
  flex: 1;
  padding: 13px;
  background: #151515;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  font-size: 16px;
}

#send {
  padding: 10px 18px;
  background: red;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<h1>My AI 🤖</h1>

<div id="chat"></div>

<div id="bottom">
<input id="input" placeholder="پیامت را بنویس...">
<button id="send">ارسال</button>
</div>

<script>

const WORKER =
"https://old-fire-5f7e.ydanyani95.workers.dev/";

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "msg " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

  const text = input.value.trim();

  if (text === "") return;

  addMessage(text, "user");

  input.value = "";

  addMessage("در حال فکر کردن...", "ai");

  const ai = chat.lastElementChild;

  try {

    const response = await fetch(WORKER, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        data.error ||
        "Server Error"
      );
    }

    ai.textContent =
      data.reply || "AI پاسخی نداد.";

  } catch (error) {

    ai.textContent =
      "خطا در اتصال به Worker ❌";

    console.log(error);

  }
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(e) {

  if (e.key === "Enter") {
    sendMessage();
  }

});

</script>

</body>
</html>
