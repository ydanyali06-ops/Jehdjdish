<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  text-align: center;
  background: #090909;
  border-bottom: 1px solid #300000;
  color: #ff2020;
  font-size: 24px;
  font-weight: bold;
}

#chat {
  height: calc(100vh - 140px);
  overflow-y: auto;
  padding: 15px;
}

.message {
  max-width: 85%;
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.user {
  margin-right: auto;
  background: #330000;
  border: 1px solid #700000;
}

.ai {
  margin-left: auto;
  background: #151515;
  border: 1px solid #333;
}

#inputBox {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #090909;
  border-top: 1px solid #300000;
}

#message {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #111;
  color: white;
  outline: none;
  font-size: 16px;
}

button {
  padding: 0 18px;
  border: none;
  border-radius: 12px;
  background: #e00000;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  background: #900000;
}
</style>
</head>

<body>

<header>My AI 🤖</header>

<div id="chat"></div>

<div id="inputBox">
  <input
    id="message"
    type="text"
    placeholder="پیامت را بنویس..."
    autocomplete="off"
  >
  <button onclick="sendMessage()">ارسال</button>
</div>

<script>

const WORKER_URL =
"https://old-fire-5f7e.ydanyali95.workers.dev/";

const chat = document.getElementById("chat");
const messageInput = document.getElementById("message");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

  const text = messageInput.value.trim();

  if (!text) return;

  addMessage(text, "user");

  messageInput.value = "";

  addMessage("در حال فکر کردن...", "ai");

  const aiMessage =
    chat.lastElementChild;

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        data.error ||
        "خطای سرور"
      );
    }

    aiMessage.textContent =
      data.reply || "پاسخی دریافت نشد.";

  }
